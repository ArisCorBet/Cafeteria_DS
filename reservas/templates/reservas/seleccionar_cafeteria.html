{% extends 'reservas/base.html' %}

{% block content %}
<h2>{{ cafeteria.nombre }}</h2>

<h3>Fechas reservadas</h3>
<ul>
  {% for fecha in fechas_reservadas %}
    <li>{{ fecha }}</li>
  {% empty %}
    <li>No hay reservas aún</li>
  {% endfor %}
</ul>

<hr>

<form method="get">
  <label>Selecciona una fecha:</label><br>
  <input type="date" name="fecha" value="{{ fecha_seleccionada }}">
  <button type="submit">Continuar</button>
</form>

{% if fecha_seleccionada %}
  <hr>
  <a href="{% url 'reservas:seleccionar_mesa' cafeteria.id %}?fecha={{ fecha_seleccionada }}">
    Ver mesas disponibles
  </a>
{% endif %}
{% endblock %}

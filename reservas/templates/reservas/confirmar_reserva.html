{% extends 'reservas/base.html' %}

{% block content %}


<button type="button" id="abrir-modal" class="btn">Confirmar Reserva</button>

<div id="modal-confirmar" class="modal-reserva" style="display:none;">
  <div class="modal-contenido">
    <h2>Confirmar Reserva</h2>
    <p><strong>Mesa:</strong> {{ mesa.codigo }}</p>
    <p><strong>Capacidad:</strong> {{ mesa.capacidad }} personas</p>
    <p><strong>Fecha:</strong> {{ fecha }}</p>
    <p><strong>Horario:</strong> {{ hora_inicio }} - {{ hora_fin }}</p>
    <form id="form-confirmar" method="post" autocomplete="off" style="margin-top:18px;">
      {% csrf_token %}
      <button type="submit" class="btn btn-aceptar">Aceptar</button>
      <button type="button" class="btn btn-cancelar" id="cerrar-modal">Cancelar</button>
    </form>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('abrir-modal').onclick = function(e) {
      e.preventDefault();
      document.getElementById('modal-confirmar').style.display = 'flex';
    };
    document.getElementById('cerrar-modal').onclick = function() {
      document.getElementById('modal-confirmar').style.display = 'none';
    };
  });
</script>

{% endblock %}

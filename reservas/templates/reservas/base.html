{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LatteGo</title>
    <link rel="stylesheet" href="{% static 'reservas/styles.css' %}">
</head>
<body>

<!-- =========================
     HEADER SUPERIOR
     ========================= -->
<header class="main-header">
    <div class="header-left">
        <span class="logo">☕ LatteGo</span>
    </div>

    <div class="header-right">
        <span class="usuario">
            {{ request.user.username }}
        </span>

        <!-- Acciones futuras (solo visual) -->
        <a href="{% url 'mis_reservas' %}" class="header-link">Mis reservas</a>
    
        <form action="{% url 'logout' %}" method="post" style="display:inline;">
    {% csrf_token %}
    <button type="submit" class="header-link salir" style="background:none; border:none; color:inherit; font:inherit; cursor:pointer;">
        Cerrar sesión
    </button>
</form>
    </div>
</header>

<!-- =========================
     INDICADOR DE PASOS
     ========================= -->
{% block step_indicator %}
{% endblock %}

<!-- =========================
     CONTENIDO PRINCIPAL
     ========================= -->
<main class="container">
    {% block content %}
    {% endblock %}
</main>

</body>
</html>

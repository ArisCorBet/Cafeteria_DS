{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LatteGo</title>
    <link rel="stylesheet" href="{% static 'reservas/styles.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>

<!-- =========================
     HEADER SUPERIOR
     ========================= -->
<header class="main-header">
    <div class="header-left">
        <span class="logo">☕ LatteGo</span>
    </div>

    <div class="header-right">
        {% if request.user.is_authenticated %}
            <span class="usuario">
                {{ request.user.username }}
            </span>

            <a href="{% url 'mis_reservas' %}" class="header-link">Mis reservas</a>
        
            <form action="{% url 'logout' %}" method="post" class="inline">
                {% csrf_token %}
                <button type="submit" class="header-link salir no-bg no-border color-inherit font-inherit cursor-pointer">
                    Cerrar sesión
                </button>
            </form>
        {% endif %}
    </div>
</header>


<!-- =========================
    CONTENEDOR UNIFICADO
    ========================= -->
<main class="container">
    {% block step_indicator %}{% endblock %}
    {% block content %}{% endblock %}
</main>

</body>
</html>
